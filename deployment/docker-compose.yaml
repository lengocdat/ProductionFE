services:
  postgres:
    image: postgres:16-alpine
    container_name: sportmatch-postgres
    environment:
      POSTGRES_DB: sportmatch
      POSTGRES_USER: sportmatch
      POSTGRES_PASSWORD: sportmatch_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../CoDuyen/deployment/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sportmatch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../CoDuyen
      dockerfile: deployment/Dockerfile
    container_name: sportmatch-backend
    environment:
      IS_LOCAL_DEV: "true"
      SERVER_ADDR: ":8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sportmatch
      POSTGRES_PASSWORD: sportmatch_secret
      POSTGRES_DB: sportmatch
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: local-dev-secret-key-for-testing-32ch
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      COOKIE_DOMAIN: localhost
      UPLOAD_DIR: /app/uploads
      # === Điền API keys của bạn vào đây ===
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "SportMatch <onboarding@resend.dev>"
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_REDIRECT_URL: "http://localhost:8080/v1/auth/zalo/callback"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: "http://localhost:8080/v1/auth/google/callback"
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_BURST: "20"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: sportmatch-frontend
    environment:
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
