services:
  redis:
    image: redis:alpine
    container_name: redis

  bookmark_service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: bookmark_service
    depends_on:
      - redis
    env_file:
      - ./bookmark_service/.env

  portal:
    image: ebvn/bookmark-app-portal:mono
    platform: linux/amd64
    container_name: portal
    restart: always
    ports:
      - 3000:80
    depends_on:
      - bookmark_service

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bookmark_service
