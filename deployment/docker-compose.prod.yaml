services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always

  bookmark_service:
    image: kenken52/learning-go:latest
    container_name: bookmark_service
    restart: always
    depends_on:
      - redis
    env_file:
      - ./bookmark_service/.env

  portal:
    image: ebvn/bookmark-app-portal:mono
    container_name: portal
    restart: always
    depends_on:
      - bookmark_service

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - bookmark_service
      - portal
