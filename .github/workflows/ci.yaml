name: CI - Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Docker image
        run: |
          docker build \
            -f deployment/Dockerfile \
            --build-arg NEXT_PUBLIC_GA_ID=G-K72ZK1WYKQ \
            -t ${{ secrets.DOCKER_USERNAME }}/coduyen-fe:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/coduyen-fe:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/coduyen-fe:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/coduyen-fe:latest
